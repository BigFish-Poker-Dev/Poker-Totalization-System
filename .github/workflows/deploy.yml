name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "実行内容。通常は auto のままでOK"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - close-old-link
          - publish-new-link
  schedule:
    # JST 2026-04-14 00:00。GitHub Actions の遅延リスクを減らすため5分前に起動して待機する。
    - cron: "55 14 13 4 *"
    # JST 2026-04-15 00:00。GitHub Actions の遅延リスクを減らすため5分前に起動して待機する。
    - cron: "55 14 14 4 *"

permissions:
  contents: read # actions/checkout 用
  pages: write # actions/deploy-pages 用
  id-token: write # OIDC で Pages デプロイに必要

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  VITE_BASE_PATH: "/Poker-Totalization-System/"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.select.outputs.action }}
      reason: ${{ steps.select.outputs.reason }}
      target_utc: ${{ steps.select.outputs.target_utc }}
    steps:
      - name: Select deployment action
        id: select
        env:
          MANUAL_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          set -euo pipefail

          action="skip"
          reason="No deployment is needed for this run."
          target_utc=""

          close_target_utc="2026-04-13T15:00:00Z"
          publish_target_utc="2026-04-14T15:00:00Z"
          publish_epoch="$(date -u -d "${publish_target_utc}" +%s)"
          now_epoch="$(date -u +%s)"
          today_utc="$(date -u +%F)"

          if [[ "${MANUAL_MODE}" == "close-old-link" ]]; then
            action="close"
            reason="Manual close-old-link dispatch."
          elif [[ "${MANUAL_MODE}" == "publish-new-link" ]]; then
            action="publish"
            reason="Manual publish-new-link dispatch."
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            if [[ "${today_utc}" == "2026-04-13" ]]; then
              action="close"
              target_utc="${close_target_utc}"
              reason="Scheduled close for JST 2026-04-14 00:00."
            elif [[ "${today_utc}" == "2026-04-14" ]]; then
              action="publish"
              target_utc="${publish_target_utc}"
              reason="Scheduled publish for JST 2026-04-15 00:00."
            else
              reason="Ignoring yearly cron recurrence outside the 2026 transition dates."
            fi
          elif (( now_epoch >= publish_epoch )); then
            action="publish"
            reason="Push after JST 2026-04-15 00:00."
          else
            reason="Push before JST 2026-04-15 00:00; keeping the current Pages deployment unchanged."
          fi

          echo "action=${action}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "target_utc=${target_utc}" >> "${GITHUB_OUTPUT}"
          echo "${reason}"

  close_old_link:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.action == 'close'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait until scheduled target time
        env:
          TARGET_UTC: ${{ needs.plan.outputs.target_utc }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_UTC}" ]]; then
            exit 0
          fi

          target_epoch="$(date -u -d "${TARGET_UTC}" +%s)"
          now_epoch="$(date -u +%s)"
          if (( now_epoch < target_epoch )); then
            sleep "$(( target_epoch - now_epoch ))"
          fi

      - name: Remove custom domain from Pages settings
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pages" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --input - <<'JSON'
          {"cname":null}
          JSON
          then
            echo "Custom domain removed from Pages settings."
          else
            echo "::warning::Custom domain removal failed. Set a PAGES_ADMIN_TOKEN repository secret with Pages write and Administration write permissions, or remove the domain manually in Settings > Pages."
          fi

      - name: Build closed-link page
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Poker Totalization System</title>
              <style>
                :root {
                  color: #17202a;
                  background: #f7f9fb;
                  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  padding: 24px;
                }
                main {
                  max-width: 640px;
                }
                h1 {
                  font-size: 24px;
                  line-height: 1.3;
                  margin: 0 0 16px;
                }
                p {
                  font-size: 16px;
                  line-height: 1.8;
                  margin: 0 0 12px;
                }
                a {
                  color: #065f46;
                  overflow-wrap: anywhere;
                }
              </style>
            </head>
            <body>
              <main>
                <h1>公開URLの切り替え中です</h1>
                <p>旧URLでの公開は終了しました。</p>
                <p>2026年4月15日 0:00（JST）から、次のURLで利用できます。</p>
                <p><a href="https://BigFish-Poker-Dev.github.io/Poker-Totalization-System/">https://BigFish-Poker-Dev.github.io/Poker-Totalization-System/</a></p>
              </main>
            </body>
          </html>
          HTML
          cp dist/index.html dist/404.html

      - name: Upload closed-link artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy closed-link page
        id: deployment
        uses: actions/deploy-pages@v4

  build:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
          # ==== Vite 向けビルド時環境変数 ====
          VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET: ${{ secrets.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_MESSAGING_SENDER_ID: ${{ secrets.VITE_FB_MESSAGING_SENDER_ID }}
          VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}
          VITE_FB_MEASUREMENT_ID: ${{ secrets.VITE_FB_MEASUREMENT_ID }}

      # SPA ルーティング用フォールバック
      - name: SPA fallback (copy index.html -> 404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs:
      - plan
      - build
    if: needs.plan.outputs.action == 'publish'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait until scheduled target time
        env:
          TARGET_UTC: ${{ needs.plan.outputs.target_utc }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_UTC}" ]]; then
            exit 0
          fi

          target_epoch="$(date -u -d "${TARGET_UTC}" +%s)"
          now_epoch="$(date -u +%s)"
          if (( now_epoch < target_epoch )); then
            sleep "$(( target_epoch - now_epoch ))"
          fi

      - name: Ensure custom domain is removed
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pages" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --input - <<'JSON'
          {"cname":null}
          JSON
          then
            echo "Custom domain removed from Pages settings."
            exit 0
          fi

          if current_cname="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""' 2>/dev/null)"; then
            if [[ -z "${current_cname}" ]]; then
              echo "Custom domain is already empty."
              exit 0
            fi

            echo "::error::Custom domain is still set to ${current_cname}. Set a PAGES_ADMIN_TOKEN repository secret with Pages write and Administration write permissions, or remove the domain manually in Settings > Pages, then rerun publish-new-link."
            exit 1
          fi

          echo "::error::Custom domain removal failed and the current Pages setting could not be verified. Set a PAGES_ADMIN_TOKEN repository secret with Pages write and Administration write permissions, or remove the domain manually in Settings > Pages, then rerun publish-new-link."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  skip:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.action == 'skip'
    steps:
      - name: Explain skipped deployment
        run: echo "${{ needs.plan.outputs.reason }}"
